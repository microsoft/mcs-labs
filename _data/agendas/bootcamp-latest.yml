event_id: bootcamp-latest

# Architecture Bootcamp — Latest — 3-day agenda.
#
# Latest covers the Copilot, Standard, and Customer Conversation harnesses, followed
# by workflows, integration, operations, coding agents, FinOps, and identity.
#
# Conventions:
#   * "module" rows reference first-class entities in the _modules collection.
#     `title:` and `duration:` on the row override the module's own values.
#   * "lab" rows reference _labs/<slug>.md. `duration:` overrides the lab's own.
#   * Modules run 1-16 and labs run 1-12, in chronological order. Active module
#     numbers match their decks in `presentations/bootcamp-latest/`. Unused decks
#     remain in that folder for other deliveries; their numbers are historical.
#   * Labs use `mcs-<module-slug>`; the standalone Copilot Code lab uses
#     `mcs-copilot-code`. Shared labs have Bootcamp-specific copies so other
#     deliveries retain their existing content. Shared modules and their paired
#     Bootcamp labs use `-latest` slugs, including `workflows-latest` and
#     `mcs-workflows-latest`, to keep them separate from their shared originals.
#   * `lab: false` on module rows keeps hero stats based on the explicit lab
#     rows and their slot durations, rather than auto-counting companion labs.
#   * Lab front matter and "Lab Details" show the agenda slot. When retained
#     reference exercises take longer, the lab's pacing note says so; the
#     shorter slot is not a claim that the full exercise set has been shortened.
#   * Lab front-matter `bootcamp_order:` belongs to the *original* bootcamp event
#     (see `bootcamp_lab_orders` in _data/lab-config.yml), not to Latest. Latest lab
#     numbering lives here and in _events/bootcamp-latest.md only. Do not touch
#     `bootcamp_order` when resequencing Latest.

