event_id: architecture-bootcamp

# Architecture Bootcamp — guided missions — 3-day agenda.
#
# Same schedule, modules and slot durations as bootcamp-latest.yml. Every lab row
# points at a guided missions-format lab (lab_format: missions) that rebuilds the
# matching classic lab as a net-new page; cowork-zava-sales is shared with the
# classic event because it already uses the missions format.
#
# Conventions: see bootcamp-latest.yml. Module rows keep `lab: false` so hero
# stats count the explicit lab rows and their slot durations. `companion_lab`
# selects the module page's lab card without adding another agenda item.
schedule:
