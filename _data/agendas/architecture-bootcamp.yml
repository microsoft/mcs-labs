    slug: agents-workflows-making-them-real-latest
    label: "Module 1"
    title: "Microsoft Copilot agent ecosystem"
    time: "09:30"
    duration: 45

  - type: break
    title: "Coffee break / Q&A"
    time: "10:15"
    duration: 15

