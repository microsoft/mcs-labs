    lab: false
    companion_lab: copilot-chat-workiq
    title: "Microsoft Copilot Chat and Work IQ"
    description: "Explore Copilot Chat in Microsoft Copilot: public-web grounding, work-context retrieval with Work IQ, response modes, model selection, Researcher, and Analyst."
