    title: "Day 1 — Framing, On-ramp, Harnesses & Deep Dives"

  - type: break
    title: "Welcome"
    time: "09:00"
    duration: 15

  - type: session
    title: "Introduction to Hands-On Labs"
    description: "Lab environment, tenant setup, and how the hands-on flow works across the three days."
    label: "Intro"
    time: "09:15"
    duration: 15

