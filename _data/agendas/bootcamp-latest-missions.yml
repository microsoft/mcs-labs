# classic event because it already uses the missions format.
#
# Conventions: see bootcamp-latest.yml. Module rows keep `lab: false` so hero
# stats count the explicit lab rows and their slot durations. While the event and
# its new labs are in review, both stay unlisted (see _events/bootcamp-latest-missions.md).
