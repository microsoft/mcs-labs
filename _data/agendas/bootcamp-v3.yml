    title: "M365 Copilot"
    description: "Microsoft 365 Copilot as an agent surface — public-web grounding, Work IQ, response modes, multi-model support, frontier agents, and where it sits against the other surfaces."
    time: "10:30"
    duration: 30

  - type: lab
    slug: m365-copilot-frontier-agents
