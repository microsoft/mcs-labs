event_id: bootcamp-v3

# Architecture Bootcamp — V3 — 3-day agenda.
#
# V3 rebuilds the bootcamp around the three agent harnesses (Copilot, Standard,
# GitHub Copilot) and their component models, rather than around the classic
# Copilot Studio feature tour that V2.1 used.
#
# Conventions:
#   * "module" rows reference first-class entities in the _modules collection.
#     `title:` and `duration:` on the row override the module's own values.
#   * "lab" rows reference _labs/<slug>.md. `duration:` overrides the lab's own.
#   * Modules run 1-17 and labs run 1-9, both with no gaps and both in
#     chronological order. Every module number matches its deck in
#     `presentations/bootcamp-v3/`, so reordering the schedule means renaming
#     decks and rewriting the `slides:` paths that point at them.
#   * `lab: false` on a module row suppresses that module's companion lab from
#     the hero stats — used for M14, whose mcs-multi-agent lab is not in V3.
#   * A lab row's `duration:` is the *slot*. Each lab's own front matter and its
#     "Lab Details" table must agree with that slot, and the lab's core use cases
#     (Extra Credit excluded) should sum to it. Labs 2, 6 and 9 do not currently
#     satisfy this — see the Content Gap Analysis for the open timing items.
#   * Lab front-matter `bootcamp_order:` belongs to the *original* bootcamp event
#     (see `bootcamp_lab_orders` in _data/lab-config.yml), not to V3. V3 lab
#     numbering lives here and in _events/bootcamp-v3.md only. Do not touch
#     `bootcamp_order` when resequencing V3.
#
#   * Deep dives moved ahead of the dedicated harnesses (2026-08-31). M4
#     (Orchestration, Harnesses & Component Models) dropped 45 -> 30 and now
#     hands straight into the three deep dives — Instructions, then Skills, then
#     Knowledge & Tools — with the Copilot harness following them rather than
#     preceding them. Instructions and Skills and their labs close Day 1;
#     Knowledge & Tools opens Day 2. Every module still sits immediately before
#     its own lab, and no module/lab pair is split across a day boundary.
#
#     M11 (Creation — GitHub harness) was then pulled back to close Day 2,
#     following its own harness pair (M10 + Lab 8) rather than opening Day 3.
#
#     Day lengths shifted as a result. Day 1 gained 75 minutes and now runs
#     09:00-17:00, absorbing its 30-minute closing Q&A — Lab 4 closes the day.
#     Day 2 gained 30 and runs 09:00-19:00 — content to 17:00, then the social,
#     which is a two-hour block (it was carried as 60 minutes here in error
#     until 2026-08-31; the real event has always run about two hours).
#     Day 3 lost 90 and now ends 15:30; that time is deliberate slack for labs
#     that overrun earlier in the week.
#
#     Modules 5-13 were resequenced and their decks renamed to match:
#       M12 -> M5  Instructions & Descriptions     M8  -> M11 Creation (GitHub)
#       M13 -> M6  Skills                          M9  -> M12 Workflows
#       M11 -> M7  Knowledge & Tools               M10 -> M13 Consumption Mgmt
#       M5  -> M8  Copilot harness                 M6  -> M9  Standard harness
#       M7  -> M10 GitHub Copilot harness
#     Modules 1-4 and 14-17 are unchanged. Labs resequenced to match:
#       Lab 8 -> 3, Lab 9 -> 4, Lab 7 -> 5, Lab 3 -> 6, Lab 4 -> 7,
#       Lab 5 -> 8, Lab 6 -> 9. Labs 1 and 2 are unchanged.

schedule:
  # --- Day 1 — Framing, on-ramp, harnesses & the first deep dives ----------
