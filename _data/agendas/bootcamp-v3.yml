event_id: bootcamp-v3

# Architecture Bootcamp — V3 — 3-day agenda.
#
# V3 rebuilds the bootcamp around the three agent harnesses (Copilot, Standard,
# GitHub Copilot) and their component models, rather than around the classic
# Copilot Studio feature tour that V2.1 used.
#
# Conventions:
#   * "module" rows reference first-class entities in the _modules collection.
#     `title:` and `duration:` on the row override the module's own values.
#   * "lab" rows reference _labs/<slug>.md. `duration:` overrides the lab's own.
#   * Labs 2-6, 9 and 10 do not exist yet. They are carried as "session" rows so
#     the timeline stays complete and correctly timed; each names the seed
#     material it will be authored from. Convert each to a `type: lab` row as
#     the lab lands.
#   * `lab: false` on a module row suppresses that module's companion lab from
#     the hero stats — used for M13, whose mcs-multi-agent lab is not in V3.

schedule:
  # --- Day 1 — Framing, on-ramp & the Copilot harness ---------------------
  - type: day
    title: "Day 1 — Framing, On-ramp & Copilot Harness"

  - type: break
    title: "Welcome + Breakout"
    time: "09:00"
    duration: 15

  - type: session
    title: "Introduction to Hands-On Labs"
    description: "Lab environment, tenant setup, and how the hands-on flow works across the three days."
    label: "Intro"
    time: "09:15"
    duration: 15

  - type: module
    slug: agents-workflows-making-them-real
    label: "Module 1"
    title: "Agents & Workflows — Making Them Real"
    time: "09:30"
    duration: 45

  - type: break
    title: "Coffee break / Q&A"
    time: "10:15"
    duration: 15

  - type: module
    slug: agent-builder
    label: "Module 2"
    title: "M365 Copilot"
    # Agent Builder moves to M5 (Copilot harness) in V3, so the module entity's
    # own Agent-Builder-centric description is overridden here.
    description: "Microsoft 365 Copilot as an agent surface — what ships out of the box, the frontier agents (Researcher and Analyst), and where it sits against the other surfaces."
    slides: "/presentations/bootcamp-v3/M02.%20M365%20Copilot.pptx"
    time: "10:30"
    duration: 30

  - type: lab
    slug: m365-copilot-frontier-agents
    label: "Lab 1"
    title: "M365 Copilot and Frontier Agents"
    time: "11:00"
    duration: 30

  - type: module
