  - type: break
    title: "Re-Welcome / Re-cap"
    time: "09:00"
    duration: 15

  - type: module
    slug: knowledge-and-tools-deep-dive
    label: "Module 7"
    title: "Deep Dive: Knowledge & Tools"
    time: "09:15"
