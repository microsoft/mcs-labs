event_id: bootcamp-v3

# Architecture Bootcamp — V3 — 3-day agenda.
#
# V3 rebuilds the bootcamp around the three agent harnesses (Copilot, Standard,
# GitHub Copilot) and their component models, rather than around the classic
# Copilot Studio feature tour that V2.1 used.
#
# Conventions:
#   * "module" rows reference first-class entities in the _modules collection.
#     `title:` and `duration:` on the row override the module's own values.
#   * "lab" rows reference _labs/<slug>.md. `duration:` overrides the lab's own.
#   * Labs 1-9 are all authored and carried as `type: lab` rows.
#   * Labs run 1-9 with no gaps, in chronological order. M8 (Creation — GitHub
#     harness) is presentation-only: its 30-minute placeholder lab was dropped
#     and 15 of those minutes went to the module, which now runs 45. The labs
#     after it were resequenced down one — the former Labs 7-10 are now 6-9.
#   * `lab: false` on a module row suppresses that module's companion lab from
#     the hero stats — used for M14, whose mcs-multi-agent lab is not in V3.
#   * M10 (Consumption Management) closes Day 2 and is presentation-only. It was
#     inserted after M9, so the former M10-M16 shifted up to M11-M17 — decks in
#     `presentations/bootcamp-v3/` were renamed to match.
#   * Day 3 lab timings were rebalanced (2026-08-20): Lab 7 dropped 60 -> 30 and
#     Labs 8 and 9 rose 30 -> 45 each. The three changes cancel, so Day 3 still
#     runs 480 minutes with 120 minutes hands-on and still ends at 17:00 — but
#     everything between Lab 7 and Lab 9 moved earlier. Lunch was then moved back
#     one slot to sit after Lab 8 rather than before it, so Day 3 lunch runs
#     12:00-13:00 (was 11:45) and M12 now leads straight into its own Lab 8.
#     Day 1 and Day 2 are untouched.
#   * A lab row's `duration:` is the *slot*. Each lab's own front matter and its
#     "Lab Details" table must agree with that slot, and the lab's core use cases
#     (Extra Credit excluded) should sum to it. Labs 2, 3 and 6 do not currently
#     satisfy this — see the Content Gap Analysis for the open timing items.

schedule:
  # --- Day 1 — Framing, on-ramp & the Copilot harness ---------------------
