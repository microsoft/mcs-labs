<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Zava Copilot</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/frame-check.js" defer></script>
</head>
<body>
  <main class="pane" aria-labelledby="pane-title">
    <header class="pane__header">
      <span class="pane__mark" aria-hidden="true">Z</span>
      <div>
        <h1 id="pane-title">Zava Copilot</h1>
        <p class="pane__subtitle">Side pane host · placeholder</p>
      </div>
    </header>
    <section class="card" aria-labelledby="status-title">
      <h2 id="status-title">Connection check</h2>
      <p>This page will host the Zava Copilot chat. It doesn't sign you in or load any data yet.</p>
      <dl class="facts">
        <div><dt>Embedded</dt><dd id="embedded">Checking…</dd></div>
        <div><dt>Framed by</dt><dd id="ancestors">Checking…</dd></div>
      </dl>
    </section>
  </main>
</body>
</html>
